# AWS Amplify Hosting build spec (Next.js SSR). Environment variables (see .env.example) are set per branch
# in the Amplify console; leave NEXT_PUBLIC_USE_MOCK_API unset or "true" until the accounting API is live.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
